<dialog
  #dialog
  class="dialog"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="bodyId"
  (close)="closed()"
>
  <div class="head">
    <h2 class="heading" tabindex="-1" [id]="headingId">{{ heading() }}</h2>
    <ret-button
      variant="ghost"
      icon="x"
      iconPosition="only"
      [label]="closeLabel()"
      (pressed)="dialog.close()"
    />
  </div>
  <div class="body" [id]="bodyId"><ng-content /></div>
  <div class="actions">
    @if (secondaryLabel(); as label) {
      <ret-button variant="secondary" [label]="label" (pressed)="secondaryPressed.emit()" />
    }
    <ret-button
      [variant]="tone() === 'danger' ? 'danger' : 'primary'"
      [label]="primaryLabel()"
      (pressed)="primaryPressed.emit()"
    />
  </div>
</dialog>
