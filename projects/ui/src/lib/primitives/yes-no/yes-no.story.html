<main class="ret-stack">
  <h1>YesNo</h1>
  @for (variant of variants.variant | keyvalue: null; track variant.key) {
    <ret-yes-no [label]="variant.value" [variant]="variant.key" />
  }
  <ret-yes-no
    label="Is this still right?"
    yesLabel="Still right"
    noLabel="Something's changed"
    [formControl]="yes"
  />
  <ret-yes-no label="Do you have any care needs?" icon="info" hint="Including help at home" />
  <ret-yes-no label="Have you moved house?" error="Choose yes or no" />
  <ret-yes-no
    label="Did Sarah start university at Leeds this September?"
    [detail]="{ when: false, label: 'What is Sarah doing instead?' }"
    [formControl]="withDetail"
  />
  <ret-yes-no
    label="Is 07700 900123 still the best number to reach you?"
    [detail]="{ when: false, label: 'What number should Helen use?' }"
    detailError="Enter the number Helen should use"
    [formControl]="detailError"
  />
  <ret-yes-no label="Disabled" [formControl]="disabled" />
</main>
