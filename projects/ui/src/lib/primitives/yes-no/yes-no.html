<fieldset
  class="field"
  [attr.data-variant]="variant()"
  [attr.data-invalid]="error() ? true : null"
  [disabled]="disabled()"
  (focusout)="leave($event)"
  [attr.aria-describedby]="describedBy()"
>
  <legend class="question">
    @if (icon(); as icon) {
      <ret-icon [name]="icon" />
    }
    {{ label() }}
  </legend>
  <ret-field-messages
    [fieldId]="id"
    [hint]="hint()"
    [error]="error()"
    [errorPrefix]="errorPrefix()"
  />
  <div class="options">
    @for (option of options(); track option.value) {
      <label class="option">
        <input
          type="radio"
          class="ret-visually-hidden"
          [name]="id"
          [checked]="value() === option.value"
          [attr.aria-describedby]="detailShown() && value() === option.value ? revealId : null"
          (change)="select(option.value)"
        />
        <span class="choice">
          @if (value() === option.value) {
            <ret-icon name="check" />
          }
          {{ option.label }}
        </span>
      </label>
    }
  </div>
  @if (detailShown()) {
    <span class="ret-visually-hidden" [id]="revealId">{{ detail()?.label }}</span>
    <ret-text-field
      type="multiline"
      [label]="detail()!.label"
      [error]="detailError()"
      [errorPrefix]="errorPrefix()"
      [formControl]="detailText"
    />
  }
</fieldset>
