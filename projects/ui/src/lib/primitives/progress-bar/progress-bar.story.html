<main class="ret-stack">
  <h1>ProgressBar</h1>
  @for (variant of variants.variant | keyvalue: null; track variant.key) {
    <h2>{{ variant.value }}</h2>
    <ret-progress-bar
      [variant]="variant.key"
      label="Your details"
      [step]="2"
      [total]="6"
      valueText="Step 2 of 6"
      meta="About 8 minutes left"
    />
  }
  <h2>Without meta, complete</h2>
  <ret-progress-bar label="Your goals" [step]="4" [total]="4" valueText="Step 4 of 4" />
</main>
