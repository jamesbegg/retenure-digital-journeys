<div class="text">
  <span class="label" [id]="labelId">{{ label() }}</span>
  @if (meta()) {
    <span class="meta" [id]="metaId">{{ meta() }}</span>
  }
</div>
<div
  class="track"
  role="progressbar"
  aria-valuemin="0"
  [attr.aria-valuemax]="total()"
  [attr.aria-valuenow]="step()"
  [attr.aria-valuetext]="valueText()"
  [attr.aria-labelledby]="labelId"
  [attr.aria-describedby]="meta() ? metaId : null"
  [attr.data-variant]="variant()"
>
  @if (variant() === 'segmented') {
    @for (done of segments(); track $index) {
      <span class="segment" [class.done]="done"></span>
    }
  } @else {
    <span class="fill" [style.inline-size.%]="percent()"></span>
  }
</div>
