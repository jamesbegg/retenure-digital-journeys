<button
  class="button"
  [class]="[variant(), size()]"
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-disabled]="pending() || null"
  [attr.aria-label]="icon() && iconPosition() === 'only' ? label() : null"
  (click)="press($event)"
>
  <span class="content">
    @if (pending()) {
      <ret-icon class="spinner" name="loader-circle" />
    } @else if (iconPosition() !== 'trailing') {
      @if (icon(); as name) {
        <ret-icon [name]="name" />
      }
    }
    @if (!icon() || iconPosition() !== 'only') {
      <span class="label">{{ label() }}</span>
    }
    @if (!pending() && iconPosition() === 'trailing') {
      @if (icon(); as name) {
        <ret-icon [name]="name" />
      }
    }
  </span>
</button>
<span class="ret-visually-hidden" role="status">{{ pending() ? pendingLabel() : '' }}</span>
