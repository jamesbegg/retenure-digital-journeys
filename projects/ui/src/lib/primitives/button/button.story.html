<main>
  <h1>Button</h1>

  @for (size of variants.size | keyvalue: null; track size.key) {
    <h2>{{ size.value }}</h2>
    <ul>
      @for (variant of variants.variant | keyvalue: null; track variant.key) {
        <li>
          <ret-button [label]="variant.value" [variant]="variant.key" [size]="size.key" />
        </li>
      }
    </ul>
  }

  <h2>Icons</h2>
  <ul>
    <li><ret-button label="Back" icon="arrow-left" variant="secondary" /></li>
    <li><ret-button label="Continue" icon="arrow-right" iconPosition="trailing" /></li>
    <li>
      <ret-button label="Edit your plans" icon="pencil" iconPosition="only" variant="ghost" />
    </li>
    <li><ret-button label="Email Helen" icon="mail" variant="link" /></li>
  </ul>

  <h2>States</h2>
  <ul>
    <li><ret-button [label]="variants.disabled" [disabled]="true" /></li>
    <li><ret-button label="Save" [pending]="true" pendingLabel="Saving your answers" /></li>
    <li>
      <ret-button
        label="Save my answers and come back to the rest of the check-in later"
        variant="secondary"
      />
    </li>
  </ul>
</main>
