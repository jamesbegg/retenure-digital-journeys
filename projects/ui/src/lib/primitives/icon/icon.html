<svg
  #svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  focusable="false"
  [attr.role]="accessibleName() ? 'img' : null"
  [attr.aria-label]="accessibleName()"
  [attr.aria-hidden]="accessibleName() ? null : 'true'"
></svg>
