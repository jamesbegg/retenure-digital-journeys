<ret-journey-shell [heading]="heading()" [state]="state()">
  @if (firmName(); as name) {
    <ret-client-header
      slot="header"
      [firmName]="name"
      [firmMark]="firmMark()"
      [progress]="headerProgress()"
      [backLabel]="backable() ? labels().back : undefined"
      (back)="back.emit()"
    />
  }
  <ng-content />
  <ng-content ngProjectAs="[slot=actions]" select="[slot=actions]" />
  @if (adviser(); as adviser) {
    <ret-adviser-contact
      slot="contact"
      variant="compact"
      [name]="adviser.name"
      [initials]="initials(adviser.name)"
      [email]="adviser.email"
      [phone]="adviser.phone"
      [contactLine]="labels().contactLine"
      [emailLabel]="emailLabel()"
      [label]="labels().adviserLabel"
    />
  }
  @if (urgentLabel(); as label) {
    <ret-button slot="contact" variant="link" [label]="label" (pressed)="urgentOpen.set(true)" />
  }
</ret-journey-shell>

@if (urgent(); as urgent) {
  <ret-modal
    placement="sheet"
    [heading]="urgent.heading"
    [primaryLabel]="urgent.primary"
    [closeLabel]="labels().close"
    [(open)]="urgentOpen"
    (primaryPressed)="call(urgent.href)"
  >
    <p>{{ urgent.body }}</p>
    <p>{{ urgent.emergency }}</p>
  </ret-modal>
}

@if (copy(); as c) {
  <ret-modal
    [heading]="c.timeoutWarning"
    [primaryLabel]="c.moreTime"
    [closeLabel]="c.close"
    [open]="journey.idleWarning()"
    (openChange)="idleChanged($event)"
    (primaryPressed)="journey.renew()"
  />
}
