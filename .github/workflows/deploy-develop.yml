name: Deploy develop

# Publishes the digital journey build to the develop firm hosts. Run by hand until the first deploy
# has been agreed; then add `push: branches: [develop]`. Names come from DigitalJourneyDevelopStack
# in my-wealth-infra (outputs SiteBucketName, CloudFrontDistributionId, DeployRoleArn).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy role trusts only repo:jamesbegg/retenure-digital-journeys:environment:develop.
    environment: develop
    env:
      DIST: dist/app/browser
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed bundles are cached for good and kept, so a page loaded before this deploy can still
      # fetch its lazy chunks. Everything else, index.html included, is revalidated on every load.
      - name: Upload hashed assets
        run: >
          aws s3 sync "$DIST" "s3://${{ vars.SITE_BUCKET }}"
          --exclude "*" --include "*-*.js" --include "*-*.css"
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload the rest
        run: >
          aws s3 sync "$DIST" "s3://${{ vars.SITE_BUCKET }}" --delete
          --exclude "*-*.js" --exclude "*-*.css"
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
